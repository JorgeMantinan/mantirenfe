# Dependabot: actualizaciones semanales de dependencias (security updates llegan
# antes, el día que se publiquen). Monorepo pnpm + acciones de CI + imágenes base.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/api
      - /apps/web
      - /apps/worker
      - /apps/mobile
      - /packages/database
      - /packages/shared-types
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TS7 (compilador nativo) rompe tsup --dts / rollup-plugin-dts en el
      # build de shared-types: se sube cuando el toolchain lo soporte.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      minors-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /
      - /apps/api
      - /apps/web
      - /apps/worker
    schedule:
      interval: weekly
    ignore:
      # Saltar de node:22 a node:25/26 (o del nginx actual) es una subida de
      # runtime mayor: se decide a mano, no en un PR automático.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
