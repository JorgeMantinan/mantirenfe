# Sync GTFS diario (horarios + ParadaHorario + estaciones).
# Fuera de Render a propósito: el sync pica ~237 MB y el contenedor de Render
# (API + worker juntos) solo tiene512 MB en el plan free — ahí residía el OOM.
# El worker ya no programa este job (ver apps/worker/src/main.ts).
#
# Secrets requeridos (repo → Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  (mismo valor que el backup semanal: DATABASE_URL de Supabase)
#   NAP_API_KEY          (opcional; sin ella se omite el feed de Ouigo con un warning)
name: Sync GTFS diario

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 05:00/06:00 peninsular (antes del pico de mañana)
  workflow_dispatch:

# Permisos mínimos del token del workflow
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm db:generate

      # El CLI importa @mantirenfe/database (main -> dist/): hay que compilarlo
      # (turbo construye también sus dependencias del workspace).
      - name: Compilar paquetes del workspace
        run: pnpm turbo build --filter=@mantirenfe/database

      # Diagnóstico: si Renfe/NAP no responden desde el runner, el sync se
      # colgaría sin logs. Imprime status HTTP en <10 s.
      - name: Diagnóstico de red (feeds)
        run: |
          echo -n "renfe: " && curl -s -o /dev/null -w "%{http_code} en %{time_total}s" --max-time 10 -I https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip || echo "SIN RESPUESTA"
          echo ""
          echo -n "nap: " && curl -s -o /dev/null -w "%{http_code} en %{time_total}s" --max-time 10 https://nap.transportes.gob.es/api/Fichero/download/1766 -H "ApiKey: ${{ secrets.NAP_API_KEY }}" || echo "SIN RESPUESTA"
          echo ""

      - name: Sincronizar estaciones, horarios y paradas GTFS
        run: pnpm --filter @mantirenfe/worker exec tsx src/cli/sync-gtfs.ts
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          # GTFS_DIAS_VENTANA no se fija aquí: la ventana la manda
          # VENTANA_GTFS_DIAS (packages/shared-types/src/constantes.ts, hoy 25),
          # la misma constante que valida la API y limita el formulario.
          GTFS_ZIP_URLS_OUIGO: 'https://nap.transportes.gob.es/api/Fichero/download/1766'
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}

      # Auditoría de privilegios de BD (RLS/grants) tras cada sync
      - name: Auditoria de privilegios BD
        run: pnpm --filter @mantirenfe/database db:audit
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
