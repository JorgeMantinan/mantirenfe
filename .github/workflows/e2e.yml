# E2E de humo contra producción (web + API). Corre tras el sync diario para
# detectar regresiones (tripIds, endpoints, ciclo de alertas) antes que los
# usuarios. Cuenta de pruebas: si el repo se hace pública, mover las credenciales
# a secrets (E2E_EMAIL / E2E_PASSWORD en el script).
name: E2E producción

on:
  schedule:
    - cron: '40 5 * * *' # 05:40 UTC = 06:40/07:40 peninsular (tras el sync de las 04:00)
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar E2E de producción
        run: pnpm --filter @mantirenfe/worker exec tsx scripts/e2e-produccion.ts
