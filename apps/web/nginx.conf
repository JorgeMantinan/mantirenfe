server {
    server_tokens off;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Misma política que vercel.json (modo enforcement). OJO con `add_header`:
  # NO se hereda a los bloques que ya declaran el suyo propio, así que hay que
  # repetirla en /assets/ y /sw.js para que ninguna respuesta se quede sin ella.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https: wss:; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https://mcntuqhmtnzoppkhpjxn.supabase.co wss://*.supabase.co https://o12.ingest.sentry.io https://*.doubleclick.net https://*.googleadservices.com https://*.googlesyndication.com; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https: wss:; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https://mcntuqhmtnzoppkhpjxn.supabase.co wss://*.supabase.co https://o12.ingest.sentry.io https://*.doubleclick.net https://*.googleadservices.com https://*.googlesyndication.com; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;
  }

  location /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https: wss:; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.google.com; connect-src 'self' https://mcntuqhmtnzoppkhpjxn.supabase.co wss://*.supabase.co https://o12.ingest.sentry.io https://*.doubleclick.net https://*.googleadservices.com https://*.googlesyndication.com; frame-src blob: https://*.googlesyndication.com https://*.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; report-uri /api/csp-report" always;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
