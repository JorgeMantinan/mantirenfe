# Blueprint de Render: UN servicio (API) en free.
#
# El worker dejó de desplegarse aquí (2026-10): sus tareas (barrido cada
# 5 min, incidencias, suprimidos, snapshot de posiciones, digest diario,
# resumen semanal, poda) corren en GitHub Actions (`.github/workflows/
# worker.yml`) — un proceso efímero por tarea en vez de un servicio 24/7,
# que se comía 744 h/mes de las 750 h free del workspace de Render.
# En repos públicos Actions es gratis e ilimitado.
#
# Al aplicar este Blueprint (Render → New + → Blueprint → este repo):
#  - "mantirenfe" se ACTUALIZA en sitio (mismo nombre = misma URL pública;
#    la web de Vercel no cambia) y corre SOLO la API (SERVICIO=api).
#  - "mantirenfe-worker" ya no está en el blueprint: si existe en tu
#    workspace, elimínalo desde el dashboard (o pásalo a paid) tras comprobar
#    que los runs de "Worker programado" en Actions están verdes.
services:
  - type: web
    name: mantirenfe
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVICIO
        value: api
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '3000'
      # Vercel (edge) → Render =2 saltos: sin esto el rate limit ve la IP del
      # proxy y todos los usuarios comparten bucket.
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: FUENTE_DISPONIBILIDAD
        value: dwr
      - key: RETRASO_UMBRAL_SEG
        value: '300'
      - key: DWR_CACHE_SEG
        value: '120'
      - key: GTFS_DIAS_VENTANA
        value: '45'
      # Obligatorias (rellenar en el dashboard del servicio nuevo si no existen)
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
